# Pterodactyl Deployment Secrets Template
# Copy this file to config/secrets.yml and fill in your actual values
# DO NOT commit config/secrets.yml to version control

proxmox:
  api_token_id: "github-actions@pve!deploy"
  api_token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  host: "192.168.1.100"
  port: 8006
  node: "pve"

pterodactyl:
  panel:
    db_password: "strong_database_password_here"
    app_key: "base64:generated_with_php_artisan_key_generate"
    admin_password: "strong_admin_password_here"
  
  wings:
    # Generated automatically by Panel during Wings setup
    token: "auto_generated_from_panel_api"

ssl:
  certbot_email: "admin@trostrum.com"
  # Optional: If using manual certificates
  # panel_cert_path: "/path/to/panel.crt"
  # panel_key_path: "/path/to/panel.key"
  # wings_cert_path: "/path/to/wings.crt"
  # wings_key_path: "/path/to/wings.key"

backup:
  s3:
    access_key: "your_s3_access_key"
    secret_key: "your_s3_secret_key"
    bucket: "pterodactyl-backups"
    region: "us-east-1"

github:
  # GitHub personal access token for API operations (if needed)
  token: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# SSH Keys (base64 encoded or path)
ssh:
  private_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    Your private key here
    -----END OPENSSH PRIVATE KEY-----
  public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ..."
